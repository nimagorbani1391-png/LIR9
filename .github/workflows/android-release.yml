name: Build signed LIR9 Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lir9-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release signing secrets
        env:
          LIR9_KEYSTORE_BASE64: ${{ secrets.LIR9_KEYSTORE_BASE64 }}
          LIR9_KEYSTORE_PASSWORD: ${{ secrets.LIR9_KEYSTORE_PASSWORD }}
          LIR9_KEY_ALIAS: ${{ secrets.LIR9_KEY_ALIAS }}
          LIR9_KEY_PASSWORD: ${{ secrets.LIR9_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$LIR9_KEYSTORE_BASE64" || { echo "::error::Missing LIR9_KEYSTORE_BASE64"; exit 1; }
          test -n "$LIR9_KEYSTORE_PASSWORD" || { echo "::error::Missing LIR9_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$LIR9_KEY_ALIAS" || { echo "::error::Missing LIR9_KEY_ALIAS"; exit 1; }
          test -n "$LIR9_KEY_PASSWORD" || { echo "::error::Missing LIR9_KEY_PASSWORD"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Restore private Android signing key
        env:
          LIR9_KEYSTORE_BASE64: ${{ secrets.LIR9_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LIR9_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lir9-upload-key.jks"
          test -s "$RUNNER_TEMP/lir9-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/lir9-upload-key.jks"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app and PWA assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Install LIR9 native Android speech bridges
        run: |
          TARGET="android/app/src/main/java/com/lir9/platform"
          mkdir -p "$TARGET"
          cp native/android-template/app/src/main/java/com/lir9/platform/NativeTtsPlugin.java "$TARGET/NativeTtsPlugin.java"
          cp native/android-template/app/src/main/java/com/lir9/platform/NativeSpeechPlugin.java "$TARGET/NativeSpeechPlugin.java"
          cp native/android-template/app/src/main/java/com/lir9/platform/MainActivity.java "$TARGET/MainActivity.java"
          node scripts/patch-android-manifest.mjs

      - name: Generate official LIR9 launcher icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#080807" --iconBackgroundColorDark "#080807"

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Configure release signing
        run: node scripts/patch-android-release-signing.mjs
        env:
          LIR9_KEYSTORE_PATH: ${{ runner.temp }}/lir9-upload-key.jks
          LIR9_KEYSTORE_PASSWORD: ${{ secrets.LIR9_KEYSTORE_PASSWORD }}
          LIR9_KEY_ALIAS: ${{ secrets.LIR9_KEY_ALIAS }}
          LIR9_KEY_PASSWORD: ${{ secrets.LIR9_KEY_PASSWORD }}

      - name: Build signed release APK and Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify release artifacts and signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -E "package: name='com.lir9.platform'|sdkVersion:"
          ls -lh "$APK" "$AAB"
          sha256sum "$APK" "$AAB"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LIR9-Signed-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
