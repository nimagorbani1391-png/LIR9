name: Build LIR9 Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "public/manifest.webmanifest"
      - "public/lir9-icon.svg"
      - "scripts/generate-icons.mjs"
      - "scripts/init-twa.exp"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: lir9-android-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TWA_MANIFEST_URL: https://lir9-platform.pages.dev/manifest.webmanifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install web dependencies
        run: npm install

      - name: Build LIR9 web app and Android icons
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Wait for the updated Cloudflare Pages manifest
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$TWA_MANIFEST_URL" -o /tmp/lir9-manifest.json; then
              if grep -q 'icon-maskable-512.png' /tmp/lir9-manifest.json; then
                break
              fi
            fi
            sleep 10
          done
          grep -q 'icon-maskable-512.png' /tmp/lir9-manifest.json

      - name: Initialize Trusted Web Activity project
        run: |
          mkdir -p android
          expect scripts/init-twa.exp

      - name: Enforce Android SDK and minimum version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          source = path.read_text()
          source, count = re.subn(r"minSdkVersion\\s+\\d+", "minSdkVersion 24", source, count=1)
          if count != 1:
              raise SystemExit("Could not locate minSdkVersion in generated Android project")
          if "compileSdkVersion 36" not in source or "targetSdkVersion 36" not in source:
              raise SystemExit("Generated project does not target Android API 36")
          path.write_text(source)
          print("Verified compileSdk 36, targetSdk 36, minSdk 24")
          PY

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIR9-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
